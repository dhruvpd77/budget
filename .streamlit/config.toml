# Works locally and on Streamlit Community Cloud / container hosts.
# https://docs.streamlit.io/develop/concepts/configuration/options

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
maxUploadSize = 200

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#818cf8"
backgroundColor = "#070a12"
secondaryBackgroundColor = "#111827"
textColor = "#e2e8f0"
font = "sans serif"
